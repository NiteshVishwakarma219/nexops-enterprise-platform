services:

  postgres:
    image: postgres:16-alpine
    container_name: nexops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nexops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexops"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    image: nexops-backend:1.0.0
    container_name: nexops-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8001:8000"

    environment:
      NODE_ENV: production
      PORT: 8000

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexops?schema=public

      JWT_SECRET: local-docker-development-secret-change-this
      JWT_EXPIRES_IN: 1d

      ALLOWED_ORIGIN: http://localhost
      FRONTEND_URL: http://localhost

      ADMIN_KEY: local-docker-admin-key-change-this
      RESET_TOKEN_EXPIRE_MINUTES: 10

      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: 10


  frontend:
    image: nexops-frontend:1.0.0
    container_name: nexops-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"


volumes:
  postgres_data: