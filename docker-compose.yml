services:

  postgres:
    image: postgres:16
    container_name: nexops-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: nexops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build:
      context: ./backend

    container_name: nexops-backend

    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "5000:8000"

    env_file:
      - backend/.env

  frontend:

    build:
      context: ./frontend

    container_name: nexops-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:

  postgres_data:
